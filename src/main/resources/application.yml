spring:
  application:
    name: taskflow-api
  datasource:
    url: jdbc:postgresql://localhost:5432/taskflow
    username: postgres
    password: theNinjaDev_0
  jpa:
    show-sql: true
  jwt:
    secret: ${JWT_SECRET}
    accessTokenExpiration: 900 # 15m
    refreshTokenExpiration: 604800 # 7d
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
app:
  storage:
    access-key: ${B2_KEY_ID}
    secret-key: ${B2_APPLICATION_KEY}
    endpoint: ${B2_ENDPOINT}
    bucket: ${B2_BUCKET_NAME}
    region: us-east-005
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  avatar:
    max-size: 5MB